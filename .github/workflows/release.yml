name: Release

# Releases `perceivo` to TestPyPI and then PyPI through trusted publishing.
#
# The controls that decide whether bytes reach PyPI live outside this file,
# because this file is read from the tagged commit:
#   1. the `release-tags` ruleset decides who may create a `v*` tag;
#   2. the `pypi` environment requires its human reviewer, prevents
#      self-review and does not let administrators bypass it;
#   3. the PyPI trusted publisher is bound to this workflow AND to the `pypi`
#      environment.
# The checks below are mistake guards. `scripts/check_release_settings.py`
# reads the three controls back before every tag push (see RELEASING.md).
#
# A `workflow_dispatch` run is a dry run: it verifies, builds and installs,
# and every upload job is skipped.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      upload: ${{ steps.release.outputs.upload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and every ref in one fetch, so the ancestry check
          # below needs no later `git fetch`.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the workflow policy of this commit
        run: |
          python -m pip install --only-binary :all: "pyyaml==6.0.3"
          python scripts/check_workflow_policy.py --root .
      - name: Check the tag against VERSION, pyproject.toml and main
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            upload=true
          else
            # Dry run: check the tag this commit would need, on a local-only tag.
            tag="v$(cat VERSION)"
            git tag "$tag" "$GITHUB_SHA"
            upload=false
          fi
          python scripts/check_release_tag.py --tag "$tag" --commit "$GITHUB_SHA" --main-ref origin/main
          {
            echo "version=${tag#v}"
            echo "upload=$upload"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/build-distributions.yml

  # Every job below that handles distribution files proves them against the
  # build job's OUTPUTS (file names and sha256). Job outputs are fixed when the
  # build job finishes; run artifacts are not, because any later job in the run
  # can delete and re-create an artifact with its runtime token. So an artifact
  # is only ever a carrier of bytes here, never the source of a digest.
  # scripts/check_workflow_policy.py enforces this.

  install-matrix:
    name: Install wheel (Python ${{ matrix.python-version }})
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Verify the files against the build job's outputs
        env:
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          for digest in "$WHEEL_SHA256" "$SDIST_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "build output is not a sha256: '$digest'"; exit 1; }
          done
          [[ "$WHEEL_NAME" =~ ^[A-Za-z0-9_.+-]+\.whl$ ]] || { echo "bad wheel name output: '$WHEEL_NAME'"; exit 1; }
          [[ "$SDIST_NAME" =~ ^[A-Za-z0-9_.+-]+\.tar\.gz$ ]] || { echo "bad sdist name output: '$SDIST_NAME'"; exit 1; }
          test "$(ls -A dist | wc -l)" -eq 2
          printf '%s  %s\n%s  %s\n' "$WHEEL_SHA256" "$WHEEL_NAME" "$SDIST_SHA256" "$SDIST_NAME" > expected.sha256
          (cd dist && sha256sum --strict -c ../expected.sha256)
      - name: Install the built wheel into a clean virtual environment
        env:
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary :all: --index-url https://pypi.org/simple/ "dist/$WHEEL_NAME"
          "$RUNNER_TEMP/venv/bin/python" -m pip check
      - name: Smoke the installed package
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        working-directory: ${{ runner.temp }}
        run: |
          venv/bin/perceivo --help
          venv/bin/perceivo --version
          venv/bin/python -c "import importlib.metadata as m, os, perceivo, perceivo.primitives as p; from perceivo import agent, policy, orchestration; from perceivo.primitives import Agent, Policy; assert m.version('perceivo') == os.environ['EXPECTED_VERSION'] == perceivo.__version__; assert perceivo.agent is p.agent and perceivo.policy is p.policy; assert Agent and Policy and orchestration"

  testpypi:
    name: Upload to TestPyPI
    needs: [verify, build, install-matrix]
    if: needs.verify.outputs.upload == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/perceivo/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Verify the files against the build job's outputs
        env:
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          for digest in "$WHEEL_SHA256" "$SDIST_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "build output is not a sha256: '$digest'"; exit 1; }
          done
          [[ "$WHEEL_NAME" =~ ^[A-Za-z0-9_.+-]+\.whl$ ]] || { echo "bad wheel name output: '$WHEEL_NAME'"; exit 1; }
          [[ "$SDIST_NAME" =~ ^[A-Za-z0-9_.+-]+\.tar\.gz$ ]] || { echo "bad sdist name output: '$SDIST_NAME'"; exit 1; }
          test "$(ls -A dist | wc -l)" -eq 2
          printf '%s  %s\n%s  %s\n' "$WHEEL_SHA256" "$WHEEL_NAME" "$SDIST_SHA256" "$SDIST_NAME" > expected.sha256
          (cd dist && sha256sum --strict -c ../expected.sha256)
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  testpypi-smoke:
    name: TestPyPI smoke (Python ${{ matrix.python-version }})
    needs: [verify, build, testpypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prove TestPyPI serves the build job's bytes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          python scripts/compare_index_artifacts.py index \
            --index-url https://test.pypi.org --version "$VERSION" --download-dir served \
            --expect "$WHEEL_NAME=$WHEEL_SHA256" --expect "$SDIST_NAME=$SDIST_SHA256"
      - name: Install TestPyPI's wheel with dependencies from PyPI only
        # Only perceivo itself comes from TestPyPI, as the downloaded and
        # hash-matched file; every dependency resolves from pypi.org.
        env:
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary :all: --index-url https://pypi.org/simple/ "served/$WHEEL_NAME"
          "$RUNNER_TEMP/venv/bin/python" -m pip check
      - name: Smoke the installed package
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        working-directory: ${{ runner.temp }}
        run: |
          venv/bin/perceivo --version
          venv/bin/python -c "import importlib.metadata as m, os, perceivo, perceivo.primitives as p; from perceivo import agent, policy, orchestration; from perceivo.primitives import Agent, Policy; assert m.version('perceivo') == os.environ['EXPECTED_VERSION'] == perceivo.__version__; assert perceivo.agent is p.agent and perceivo.policy is p.policy; assert Agent and Policy and orchestration"

  pypi:
    name: Upload to PyPI
    needs: [verify, build, testpypi-smoke]
    if: needs.verify.outputs.upload == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/perceivo/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Verify the files against the build job's outputs
        env:
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          for digest in "$WHEEL_SHA256" "$SDIST_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "build output is not a sha256: '$digest'"; exit 1; }
          done
          [[ "$WHEEL_NAME" =~ ^[A-Za-z0-9_.+-]+\.whl$ ]] || { echo "bad wheel name output: '$WHEEL_NAME'"; exit 1; }
          [[ "$SDIST_NAME" =~ ^[A-Za-z0-9_.+-]+\.tar\.gz$ ]] || { echo "bad sdist name output: '$SDIST_NAME'"; exit 1; }
          test "$(ls -A dist | wc -l)" -eq 2
          printf '%s  %s\n%s  %s\n' "$WHEEL_SHA256" "$WHEEL_NAME" "$SDIST_SHA256" "$SDIST_NAME" > expected.sha256
          (cd dist && sha256sum --strict -c ../expected.sha256)
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  pypi-verify:
    name: PyPI verify (Python ${{ matrix.python-version }})
    needs: [verify, build, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prove PyPI serves the build job's bytes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          python scripts/compare_index_artifacts.py index \
            --index-url https://pypi.org --version "$VERSION" --download-dir served \
            --expect "$WHEEL_NAME=$WHEEL_SHA256" --expect "$SDIST_NAME=$SDIST_SHA256"
      - name: Install from PyPI
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary :all: --index-url https://pypi.org/simple/ "perceivo==$VERSION"
          "$RUNNER_TEMP/venv/bin/python" -m pip check
      - name: Smoke the installed package
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        working-directory: ${{ runner.temp }}
        run: |
          venv/bin/perceivo --version
          venv/bin/python -c "import importlib.metadata as m, os, perceivo, perceivo.primitives as p; from perceivo import agent, policy, orchestration; from perceivo.primitives import Agent, Policy; assert m.version('perceivo') == os.environ['EXPECTED_VERSION'] == perceivo.__version__; assert perceivo.agent is p.agent and perceivo.policy is p.policy; assert Agent and Policy and orchestration"

  github-release:
    name: GitHub release
    needs: [verify, build, pypi-verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Verify the files against the build job's outputs
        env:
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          for digest in "$WHEEL_SHA256" "$SDIST_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "build output is not a sha256: '$digest'"; exit 1; }
          done
          [[ "$WHEEL_NAME" =~ ^[A-Za-z0-9_.+-]+\.whl$ ]] || { echo "bad wheel name output: '$WHEEL_NAME'"; exit 1; }
          [[ "$SDIST_NAME" =~ ^[A-Za-z0-9_.+-]+\.tar\.gz$ ]] || { echo "bad sdist name output: '$SDIST_NAME'"; exit 1; }
          test "$(ls -A dist | wc -l)" -eq 2
          printf '%s  %s\n%s  %s\n' "$WHEEL_SHA256" "$WHEEL_NAME" "$SDIST_SHA256" "$SDIST_NAME" > expected.sha256
          (cd dist && sha256sum --strict -c ../expected.sha256)
      - name: Create the release with the uploaded files and their hashes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # SHA256SUMS is written from the build job's outputs by the step above.
          cp expected.sha256 SHA256SUMS
          prerelease=()
          case "$VERSION" in *rc*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "perceivo $VERSION" \
            --notes "perceivo $VERSION. See CHANGELOG.md. Distribution hashes are in SHA256SUMS." \
            "${prerelease[@]}"
