[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perceivo"
version = "1.0.0"
description = "SDK for building AI orchestration components — create, validate, and run locally or in Perceivo Cloud"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "ConceptBuilder AI", email = "support@perceivo.ai"}
]
keywords = ["ai", "orchestration", "agents", "llm", "workflow", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110",
]
redis = [
    "redis>=5.0",
]
milvus = [
    "pymilvus>=2.4",
]
elasticsearch = [
    "elasticsearch[async]>=8.0",
]
database = [
    "asyncpg>=0.29",
]
dev = [
    # pytest>=9.0.3 clears PYSEC-2026-1845; pytest-asyncio/pytest-cov must move to their
    # pytest-9-supporting lines together or pip silently downgrades pytest-asyncio.
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.19.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "setuptools>=83.0.0,<85.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "pyflakes>=3.0",
    # Same pin as the `fastapi` extra, so a development install also has it.
    "fastapi>=0.110",
]
all = [
    "perceivo[redis,milvus,elasticsearch,database,dev]",
]

[project.scripts]
perceivo = "perceivo._cli:main"

[project.urls]
Homepage = "https://perceivo.ai"
Documentation = "https://perceivo.ai/docs"
Source = "https://github.com/ConceptBuilderAI/perceivo"
Issues = "https://github.com/ConceptBuilderAI/perceivo/issues"
Changelog = "https://github.com/ConceptBuilderAI/perceivo/blob/main/CHANGELOG.md"

# Package discovery is exact: the wheel contains only ``perceivo`` and its
# subpackages. ``tests/unit/test_wheel_contents.py`` enforces this boundary.
[tool.setuptools.packages.find]
where = ["."]
include = ["perceivo", "perceivo.*"]

[tool.setuptools.package-data]
perceivo = [
    "py.typed",
    # The vendored platform template library: bundles plus SOURCE.json, written
    # by scripts/vendor_template_library.py and read by perceivo.templates.
    "templates/_library/*.json",
    # The vendored request signer's golden vectors, read at run time.
    "_internal/signing/vectors/*.json",
]

[tool.ruff]
# Public repository lint and format policy.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
extend-ignore = [
    "B008",
    "B904",
    "E501",
    "E402",
    "SIM102",
    "SIM105",
    "SIM108",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF006",
    "RUF012",
    "UP035",
    "UP042",  # str/Enum -> StrEnum: deferred; downstream behavior parity needs review.
    "UP045",
    "B007",
    "B023",
]

[tool.ruff.lint.per-file-ignores]
"perceivo/**/__init__.py" = ["F401"]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# Optional service clients are absent from a base SDK installation. Only their
# third-party imports are untyped; SDK adapter bodies remain fully checked.
[[tool.mypy.overrides]]
module = ["redis", "redis.*", "pymilvus", "elasticsearch", "asyncpg"]
ignore_missing_imports = true

# The vendored upstream request signer, the same tree [tool.coverage.run] omits
# below. It is vendored from its upstream, so its annotation gaps are fixed
# there, never edited here. An exclude on the
# command line does not work: mypy follows imports into the tree and reports it
# anyway. This override silences errors INSIDE the tree only; every caller is
# still checked against the signer's declared types.
[[tool.mypy.overrides]]
module = ["perceivo._internal.signing", "perceivo._internal.signing.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Bare `--cov` so coverage uses [tool.coverage.run] source_pkgs (which yields
# package-qualified, Sonar-resolvable filenames) rather than per-dir roots.
addopts = "--cov --cov-branch --cov-report=term-missing --cov-fail-under=95"
markers = [
    "unit: Pure unit tests, no external dependencies",
    "integration: Tests requiring local services (Redis, etc.)",
    "e2e: End-to-end tests requiring cloud API access",
]

[tool.coverage.run]
# Package-qualified, repository-relative filenames keep coverage reports
# unambiguous. The public job covers only the ``perceivo`` package.
source_pkgs = ["perceivo"]
branch = true
relative_files = true
omit = [
    "perceivo/__pycache__/*",
    # Vendored upstream signer, exercised here through
    # tests/unit/test_signing_vendored.py.
    "perceivo/_internal/signing/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
