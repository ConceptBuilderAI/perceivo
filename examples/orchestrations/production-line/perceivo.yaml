# perceivo.yaml — local development configuration
version: 1

files:
  working_dir: ./working_files
  org_dir: ./org_files

# Secrets are read from .env if it exists, otherwise from environment variables
# of the same name (for example OPENAI_API_KEY).
secrets:
  source: dotenv
  dotenv_path: .env

redis:
  enabled: false
  url: redis://localhost:6379

logging:
  level: INFO
  format: console
