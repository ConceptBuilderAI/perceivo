name: Ask an Expert
description: Ask any professional a question. A start, one ChatGPT agent and an end.
nodes:
- id: node_intake
  name: Intake
  component_type: START
  script: intake/intake.py
  manifest: intake/intake.yaml
  position:
    x: 60
    y: 200
- id: node_expert
  name: Expert
  component_type: AGENT
  script: expert/expert.py
  manifest: expert/expert.yaml
  position:
    x: 360
    y: 200
- id: node_reply
  name: Reply
  component_type: END
  script: reply/reply.py
  manifest: reply/reply.yaml
  position:
    x: 660
    y: 200
ports:
- id: port_intake_external_in
  node_id: node_intake
  name: external_in
  port_type: external_in
  direction: IN
- id: port_intake_output
  node_id: node_intake
  name: output
  port_type: out
  base_schema: StartOut
  direction: OUT
- id: port_expert_input
  node_id: node_expert
  name: input
  port_type: in
  base_schema: AgentIn
  direction: IN
- id: port_expert_output
  node_id: node_expert
  name: output
  port_type: out
  base_schema: AgentOut
  direction: OUT
- id: port_reply_input
  node_id: node_reply
  name: input
  port_type: in
  base_schema: EndIn
  direction: IN
- id: port_reply_external_out
  node_id: node_reply
  name: external_out
  port_type: external_out
  direction: OUT
edges:
- source_port_id: port_intake_output
  target_port_id: port_expert_input
  kind: MAINFLOW
- source_port_id: port_expert_output
  target_port_id: port_reply_input
  kind: MAINFLOW
